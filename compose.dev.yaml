services:
  gnuplot-server:
    build:
      context: .
    image: gnuplot-server:latest
    container_name: gnuplot-server
    hostname: gnuplot-server
    restart: always
    ports:
      - 8000:8000
    volumes:
      - ./main.py:/app/main.py:ro
      - /tmp/plots:/tmp/gnuplot-tool-server
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Sao_Paulo
      - GNUPLOT_OUTPUT_DIR=/tmp/gnuplot-tool-server
      - GNUPLOT_PUBLIC_OUTPUT_BASE_URL=${GNUPLOT_PUBLIC_OUTPUT_BASE_URL:-http://localhost:8080/outputs}
    networks:
      - gnuplot-net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: gnuplot-nginx:latest
    container_name: gnuplot-nginx
    restart: always
    ports:
      - 8080:80
    volumes:
      - /tmp/plots:/tmp/gnuplot-tool-server:ro
    networks:
      - gnuplot-net

networks:
  gnuplot-net:
    driver: bridge
