services:
  gnuplot-server:
    build:
      context: .
    image: gnuplot-server:latest
    container_name: gnuplot-server
    hostname: gnuplot-server
    restart: always
    #ports:
    #  - 8000:8000
    volumes:
      - ./main.py:/app/main.py:ro
      - /opt/docker/caddy/static/images:/tmp/images
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Sao_Paulo
      - GNUPLOT_OUTPUT_DIR=/tmp/images
      - GNUPLOT_PUBLIC_OUTPUT_BASE_URL=${GNUPLOT_PUBLIC_OUTPUT_BASE_URL:-https://your-public-host.example}
    user: "1000:1000"
    networks:
      - chatwebui

networks:
  chatwebui:
    external: true
