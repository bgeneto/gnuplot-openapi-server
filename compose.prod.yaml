services:
  gnuplot-server:
    build:
      context: .
    image: gnuplot-server:latest
    container_name: gnuplot-server
    hostname: gnuplot-server
    restart: always
    #ports:
    #  - 8000:8000
    volumes:
      - ./main.py:/app/main.py
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Sao_Paulo
      - GNUPLOT_PUBLIC_OUTPUT_BASE_URL=${GNUPLOT_PUBLIC_OUTPUT_BASE_URL:?Set GNUPLOT_PUBLIC_OUTPUT_BASE_URL to your public /gnuplot-outputs URL}
    networks:
      - chatwebui

networks:
  chatwebui:
    external: true
